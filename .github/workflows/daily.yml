name: Capture Daily Google Trends

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  take-screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pytrends pandas matplotlib seaborn

      - name: Run Trends Generator
        run: python script.py

      - name: Commit and Push Updated Screenshot
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add latest_trends.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily trends screenshot" && git push)
